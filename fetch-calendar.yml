// scripts/fetch-calendar.js
import { writeFile, mkdir } from 'node:fs/promises';

const URL = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json';

const res = await fetch(URL, {
  headers: { 'User-Agent': 'calendar-bot/1.0' },
});

if (!res.ok) throw new Error(`HTTP ${res.status}`);

const text = await res.text();
if (text.trimStart().startsWith('<')) {
  throw new Error('Resposta HTML — provável rate limit');
}

const events = JSON.parse(text);
if (!Array.isArray(events) || events.length === 0) {
  throw new Error('Payload vazio ou em formato inesperado');
}

await mkdir('cache', { recursive: true });
await writeFile('cache/calendar.json', JSON.stringify(events, null, 2));
console.log(`OK — ${events.length} eventos`);
