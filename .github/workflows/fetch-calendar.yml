name: Fetch Economic Calendar

on:
  schedule:
    - cron: '2 5 * * 1-5'   # 05:02 UTC — well before NY/Chicago market open
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch calendar
        run: node scripts/fetch.js

      - name: Commit updated calendar
        run: |
          git config user.name  "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cache/calendar.json
          git diff --staged --quiet && echo "No changes." || \
          (git commit -m "chore: calendar $(date -u +%Y-%m-%d)" && git push)
